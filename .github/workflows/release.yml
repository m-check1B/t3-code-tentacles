name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Pack release artifact
        id: pack
        shell: bash
        run: |
          package_file=$(npm pack --silent)
          shasum -a 256 "$package_file" > "$package_file.sha256"
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"
      - name: Publish canonical Forgejo release
        env:
          BRIDGE_RELEASE_TOKEN: ${{ github.token }}
          BRIDGE_PACKAGE_FILE: ${{ steps.pack.outputs.package_file }}
        run: node scripts/publish-forgejo-release.mjs
