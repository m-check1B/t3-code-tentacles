name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - name: Pack release artifact
        id: pack
        shell: bash
        run: |
          package_file=$(npm pack --silent)
          shasum -a 256 "$package_file" > "$package_file.sha256"
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.pack.outputs.package_file }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$PACKAGE_FILE" "$PACKAGE_FILE.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$PACKAGE_FILE" "$PACKAGE_FILE.sha256" \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
