name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: [self-hosted, jack-ci-x64]
    timeout-minutes: 20
    steps:
      # Pinned actions shared with ci.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Pack release artifact
        id: pack
        shell: bash
        run: |
          package_file=$(npm pack --silent)
          shasum -a 256 "$package_file" > "$package_file.sha256"
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"
      - name: Publish canonical GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_PACKAGE_FILE: ${{ steps.pack.outputs.package_file }}
        run: node scripts/publish-github-release.mjs
