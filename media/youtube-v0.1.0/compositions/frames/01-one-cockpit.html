  <div id="root" data-composition-id="01-one-cockpit" data-width="1920" data-height="1080" data-duration="5.15">

    <div id="f01-agent-beat" class="clip" data-start="3.8" data-duration="1.35" data-track-index="3">
      <div class="f01-burst-wrap" aria-hidden="true">
        <i class="f01-burst-item" data-target-x="-718" data-target-y="-281"></i>
        <i class="f01-burst-item" data-target-x="718" data-target-y="-281"></i>
        <i class="f01-burst-item" data-target-x="-718" data-target-y="266"></i>

      </div>

  <script>
    (() => {
      const root = document.getElementById("root");
      const tl = gsap.timeline({ paused: true });
      const duration = 4.8;
      const agentsEl = document.getElementById("f01-agents");
      const kickerEl = document.getElementById("f01-kicker");
      const swapEl = document.getElementById("f01-swap");
      const swapTextEl = document.getElementById("f01-swap-text");
      const terminalEl = document.getElementById("f01-terminal");
      const proofEl = document.getElementById("f01-proof");

      const CONTENT = [{ title: "agents", body: "" }];
      const BASE_DURATION = 0.7;
      const SEC_PER_CHAR = 0.04;
      let cumulative = 0;
      const CONTENT_TIMELINE = CONTENT.map((entry) => {
        const start = cumulative;
        cumulative += BASE_DURATION + entry.body.length * SEC_PER_CHAR;
        return { ...entry, start, end: cumulative };
      });
      function contentAt(time) {
        for (let i = CONTENT_TIMELINE.length - 1; i >= 0; i -= 1) {
          if (time >= CONTENT_TIMELINE[i].start) return CONTENT_TIMELINE[i];
        }
        return CONTENT_TIMELINE[0];
      }
      let lastTitle = "";
      const contentDriver = { t: 0 };
      tl.to(contentDriver, {
        t: cumulative,
        duration: cumulative,
        ease: "none",
        onUpdate: () => {
          const entry = contentAt(contentDriver.t);
          if (entry.title !== lastTitle) {
            agentsEl.textContent = entry.title;
            lastTitle = entry.title;
          }
        },
      }, 0);

      tl.fromTo(kickerEl, { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out" }, 0.05);
      tl.fromTo(agentsEl, { opacity: 0, y: 72, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.68, ease: "power4.out" }, 0.16);

      const SWAP_SEQUENCE = [
        { t: 0, text: "" },
        { t: 1.12, text: "behind " },
        { t: 1.72, text: "behind" },
      ];
      function swapAt(time) {
        for (let i = SWAP_SEQUENCE.length - 1; i >= 0; i -= 1) {
          if (time >= SWAP_SEQUENCE[i].t) return SWAP_SEQUENCE[i].text;
        }
        return "";
      }
      let lastSwap = "__uninitialized__";
      const swapDriver = { t: 0 };
      tl.to(swapDriver, {
        t: duration,
        duration,
        ease: "none",
        onUpdate: () => {
          const next = swapAt(swapDriver.t);
          if (next !== lastSwap) {
            swapTextEl.textContent = next;
            lastSwap = next;
          }
        },
      }, 0);
      tl.set(agentsEl, { opacity: 0 }, 1.1);
      tl.fromTo(swapEl, { opacity: 0, x: -42 }, { opacity: 1, x: 0, duration: 0.32, ease: "expo.out" }, 1.12);
      tl.set(terminalEl, { display: "inline" }, 2.08);
      tl.fromTo(terminalEl, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.42, ease: "circ.out" }, 2.08);
      tl.set([kickerEl, swapEl], { opacity: 0 }, 2.7);

      const PULSE = 0.275;
      const BEATS = [2.7, 2.7 + PULSE * 2];
      tl.fromTo("#f01-one", { opacity: 0, scale: 1.36, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.46, ease: "power4.out" }, BEATS[0]);
      tl.fromTo("#f01-cockpit", { opacity: 0, x: -280 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, BEATS[1]);
      tl.fromTo(proofEl, { opacity: 0, y: 42, rotation: 2 }, { opacity: 1, y: 0, rotation: 0, duration: 0.42, ease: "circ.out" }, 3.8);

      const burstItems = root.querySelectorAll(".f01-burst-item");
      burstItems.forEach((item, index) => {
        tl.fromTo(item, {
          xPercent: -50,
          yPercent: -50,
          x: 0,
          y: 0,
          scale: 0.55,
          opacity: 0,
        }, {
          x: Number(item.dataset.targetX),
          y: Number(item.dataset.targetY),
          scale: 1,
          opacity: 1,
          duration: 0.72,
          ease: "power3.out",
        }, 3.8 + index * 0.05);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["01-one-cockpit"] = tl;
    })();
  </script>
