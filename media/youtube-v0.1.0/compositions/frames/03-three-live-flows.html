  <script>
    (() => {
      const frameId = '03-three-live-flows';
      const tl = gsap.timeline({ paused: true });
      const q = (selector) => document.querySelector(selector);
      const qa = (selector) => Array.from(document.querySelectorAll(selector));

      const leftItems = [
        q('.f03-left-t3'),
        q('.f03-left-arrow'),
        q('.f03-left-hermes'),
      ];
      leftItems.forEach((el, index) => {
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, opacity: 0 },
          { x: Number(el.dataset.targetX), y: Number(el.dataset.targetY), scale: 1, opacity: 1, duration: 1.05, ease: 'power3.out' },
          0.30 + index * 0.07,
        );
      });
      tl.fromTo(q('.f03-hairline-left'), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.48, ease: 'power3.out' }, 0.08);
      tl.fromTo(q('.f03-note-left'), { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'power2.out' }, 1.32);

      const middleFlow = [
        { el: q('.f03-middle-hermes'), text: 'HERMES' },
        { el: q('.f03-middle-arrow'), text: '→' },
        { el: q('.f03-middle-t3'), text: 'T3' },
      ];
      const middleStarts = middleFlow.reduce((acc, item) => {
        const start = acc.cursor;
        acc.cursor += 0.20 + item.text.length * 0.035;
        acc.items.push(start);
        return acc;
      }, { cursor: 1.96, items: [] }).items;
      tl.fromTo(q('.f03-hairline-middle'), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.42, ease: 'power3.out' }, 1.84);
      middleFlow.forEach((item, index) => {
        tl.fromTo(
          item.el,
          { xPercent: -50, yPercent: -50, x: 0, y: -10, scale: 0.92, opacity: 0 },
          { x: Number(item.el.dataset.targetX), y: Number(item.el.dataset.targetY), scale: 1, opacity: 1, duration: 0.46, ease: 'power3.out' },
          middleStarts[index],
        );
      });
      tl.to(leftItems, { opacity: 0.58, duration: 0.34, ease: 'power1.out' }, 2.62);
      tl.fromTo(q('.f03-note-middle'), { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'power2.out' }, 2.76);

      tl.fromTo(q('.f03-hairline-right'), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.44, ease: 'power3.out' }, 3.20);
      tl.fromTo(q('.f03-thread'), { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: 'power3.out' }, 3.42);
      tl.fromTo(q('.f03-note-right'), { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: 'power2.out' }, 4.92);

      const SEQUENCE = [
        { t: 3.70, text: '', segment: 'main', color: '#ffffff' },
        { t: 3.88, text: '@', segment: 'brand', color: '#0055ff' },
        { t: 4.05, text: '@h', segment: 'brand', color: '#0055ff' },
        { t: 4.19, text: '@he', segment: 'brand', color: '#0055ff' },
        { t: 4.36, text: '@her', segment: 'brand', color: '#0055ff' },
        { t: 4.54, text: '@herm', segment: 'brand', color: '#0055ff' },
        { t: 4.72, text: '@herme', segment: 'brand', color: '#0055ff' },
        { t: 4.90, text: '@hermes', segment: 'brand', color: '#0055ff' },
      ];
      const entryAt = (time) => {
        for (let index = SEQUENCE.length - 1; index >= 0; index -= 1) {
          if (time >= SEQUENCE[index].t) return SEQUENCE[index];
        }
        return SEQUENCE[0];
      };
      const typingTimes = SEQUENCE.filter((entry, index) => index > 0 && entry.text !== SEQUENCE[index - 1].text).map((entry) => entry.t);
      const threadText = q('#f03-thread-text');
      const cursor = q('#f03-cursor');
      const driver = { t: 0 };
      const blink = { p: 0 };
      tl.to(driver, {
        t: 7.296,
        duration: 7.296,
        ease: 'none',
        onUpdate: () => {
          const entry = entryAt(driver.t);
          threadText.textContent = entry.text;
          cursor.style.background = entry.color;
          const isTyping = typingTimes.some((time) => time <= driver.t && driver.t - time < 0.16);
          cursor.style.opacity = isTyping || Math.sin(blink.p) > 0 ? '1' : '0';
        },
      }, 0);
      tl.to(blink, {
        p: Math.PI * 2 * 8,
        duration: 7.296,
        ease: 'none',
        onUpdate: () => {
          const isTyping = typingTimes.some((time) => time <= driver.t && driver.t - time < 0.16);
          cursor.style.opacity = isTyping || Math.sin(blink.p) > 0 ? '1' : '0';
        },
      }, 0);

      tl.fromTo(q('.f03-conversation'), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.68, ease: 'power3.out' }, 5.44);
      const tickSequence = [
        { selector: '.f03-tick-left', label: 'T3' },
        { selector: '.f03-tick-middle', label: 'HERMES' },
        { selector: '.f03-tick-right', label: 'THREAD' },
      ];
      const tickStarts = tickSequence.reduce((acc, item) => {
        const start = acc.cursor;
        acc.cursor += 0.18 + item.label.length * 0.035;
        acc.items.push(start);
        return acc;
      }, { cursor: 5.76, items: [] }).items;
      tickSequence.forEach((item, index) => {
        tl.fromTo(q(item.selector), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.34, ease: 'power3.out' }, tickStarts[index]);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[frameId] = tl;
    })();
