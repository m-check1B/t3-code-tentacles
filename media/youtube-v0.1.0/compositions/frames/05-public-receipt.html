  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt" crossorigin="anonymous"></script>
  <script>
    (() => {
      const DURATION = 8.107;
      const BLUE = "#0055ff";
      const GREEN = "#20c55a";
      const tl = gsap.timeline({ paused: true });

      gsap.set(["#frame05-proof", "#frame05-cta-card"], { opacity: 0 });

      const sequenceAt = (sequence, time) => {
        for (let index = sequence.length - 1; index >= 0; index -= 1) {
          if (time >= sequence[index].t) return sequence[index];
        }
        return sequence[0];
      };

      const addTyping = ({ sequence, textId, caretId, start, end, color = BLUE, blinkCycles = 3 }) => {
        const text = document.getElementById(textId);
        const caret = document.getElementById(caretId);
        const driver = { t: start };
        const blink = { p: 0 };
        const changeTimes = sequence.slice(1).map((entry) => entry.t);
        tl.to(driver, {
          t: end,
          duration: end - start,
          ease: "none",
          onUpdate: () => {
            const entry = sequenceAt(sequence, driver.t);
            const typing = changeTimes.some((time) => time <= driver.t && driver.t - time < 0.19);
            text.textContent = entry.text;
            caret.style.background = entry.color || color;
            caret.style.opacity = typing || Math.sin(blink.p) > 0 ? "1" : "0";
          },
        }, start);
        tl.to(blink, { p: Math.PI * 2 * blinkCycles, duration: end - start, ease: "none" }, start);
      };

      const lineOne = [
        { t: 0, text: "", color: BLUE },
        { t: 0.18, text: "FOU", color: BLUE },
        { t: 0.38, text: "FOUNDER", color: BLUE },
        { t: 0.66, text: "FOUNDER ", color: BLUE },
        { t: 0.96, text: "FOUNDER IDEA", color: BLUE },
      ];
      const lineTwo = [
        { t: 1.12, text: "", color: BLUE },
        { t: 1.31, text: "HERMES", color: BLUE },
        { t: 1.62, text: "HERMES + ORBIT", color: BLUE },
        { t: 2.08, text: "HERMES + ORBIT /", color: BLUE },
        { t: 2.42, text: "HERMES + ORBIT / ORCHESTRATED", color: BLUE },
      ];
      const lineThree = [
        { t: 3.16, text: "", color: BLUE },
        { t: 3.38, text: "CODEX", color: BLUE },
        { t: 3.74, text: "CODEX /", color: BLUE },
        { t: 4.11, text: "CODEX / EXECUTED", color: BLUE },
      ];
      const urlSequence = [
        { t: 6.56, text: "", color: BLUE },
        { t: 6.72, text: "github.com/", color: BLUE },
        { t: 7.06, text: "github.com/m-check1B/", color: BLUE },
        { t: 7.53, text: "github.com/m-check1B/t3-hermes", color: BLUE },
        { t: 7.89, text: "github.com/m-check1B/t3-hermes-bridge", color: BLUE },
      ];

      tl.fromTo(".frame05-terminal", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, 0.04);
      addTyping({ sequence: lineOne, textId: "frame05-line-one-text", caretId: "frame05-line-one-caret", start: 0, end: 1.12, blinkCycles: 2 });

      tl.to(".frame05-line-one", { y: -4.8 * 10.8, opacity: 0.38, duration: 0.38, ease: "power2.inOut" }, 1.12);
      tl.fromTo("#frame05-connector", { width: 0, opacity: 0 }, { width: "57cqw", opacity: 1, duration: 0.44, ease: "power2.out" }, 1.34);
      addTyping({ sequence: lineTwo, textId: "frame05-line-two-text", caretId: "frame05-line-two-caret", start: 1.12, end: 3.16, blinkCycles: 3 });

      tl.to(".frame05-line-two", { y: -3.2 * 10.8, opacity: 0.45, duration: 0.36, ease: "power2.inOut" }, 3.16);
      addTyping({ sequence: lineThree, textId: "frame05-line-three-text", caretId: "frame05-line-three-caret", start: 3.16, end: 5.03, blinkCycles: 3 });
      tl.fromTo("#frame05-check", { opacity: 0, scale: 0.35 }, { opacity: 1, scale: 1, duration: 0.24, ease: "power2.out" }, 4.46);

      tl.fromTo("#frame05-proof", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 5.03);
      tl.fromTo(".frame05-proof-word", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.42, stagger: 0.16, ease: "power3.out" }, 5.04);
      tl.set(".frame05-terminal", { opacity: 0 }, 5.03);

      tl.to("#frame05-proof", { scale: 0.34, y: -22 * 10.8, opacity: 0.3, duration: 0.58, ease: "power2.inOut" }, 6.06);
      tl.fromTo("#frame05-cta-card", {
        scale: 0.27,
        borderRadius: "4cqw",
        backgroundColor: BLUE,
        opacity: 1,
      }, {
        scale: 1,
        borderRadius: "0cqw",
        backgroundColor: "#18191a",
        duration: 0.86,

      tl.to("#frame05-cta-old", { opacity: 0, duration: 0.3, ease: "power1.in" }, 6.08);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-public-receipt"] = tl;
