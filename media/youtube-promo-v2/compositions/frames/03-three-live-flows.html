  <script>
    (() => {
      const D = 8.299;
      const K = D / 7.4; // packet scene timings scaled so the last scene ends exactly at D
      const S1 = 0;
      const S2 = 1.9 * K; // 2.131
      const S3 = 3.4 * K; // 3.813
      const S4 = 5.6 * K; // 6.280

      const tl = gsap.timeline({ paused: true });

      // chrome
      tl.fromTo("#f03-kicker", { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out" }, 0.05);
      tl.fromTo(".f03-divider", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.2);

      // item stagger-assemble (center-outward-expansion) per panel
      function assemble(panelSel, at) {
        const items = document.querySelectorAll(panelSel + " .f03-burst-wrap .f03-item");
        items.forEach((item, i) => {
          tl.fromTo(item, {
            xPercent: -50,
            yPercent: -50,
            x: 0,
            y: 0,
            scale: 0.6,
            opacity: 0,
          }, {
            x: Number(item.dataset.targetX),
            y: Number(item.dataset.targetY),
            scale: 1,
            opacity: 1,
            duration: 0.9,
            ease: "power3.out",
          }, at + i * 0.06);
        });
      }

      // Scene 1 (0.000–2.131): left panel assembles on the first cue
      assemble("#f03-panel-1", S1 + 0.1);

      // Scene 2 (2.131–3.813): middle panel arrives; first panel dims to 55%
      assemble("#f03-panel-2", S2 + 0.08);
      tl.to("#f03-panel-1 .f03-burst-wrap", { opacity: 0.55, duration: 0.4, ease: "power2.out" }, S2 + 0.15);

      // Scene 3 (3.813–6.280): right panel hairline draws; @hermes types with a block caret
      assemble("#f03-panel-3", S3 + 0.08);
      tl.fromTo("#f03-thread-row", {
        xPercent: -50,
        yPercent: -50,
        x: 0,
        y: 14,
        opacity: 0,
      }, {
        x: 0,
        y: -40,
        opacity: 1,
        duration: 0.55,
        ease: "power3.out",
      }, S3 + 0.2);

      // discrete-text-sequence + context-sensitive-cursor (driver local to Scene 3)
      const TYPE_DUR = S4 - S3; // 2.467s
      const SEQUENCE = [
        { t: 0.0, text: "", color: "#484B50", textColor: "#FFFFFF" },
        { t: 0.49, text: "@", color: "#0055FF", textColor: "#FFFFFF" },
        { t: 0.61, text: "@h", color: "#0055FF", textColor: "#FFFFFF" },
        { t: 0.73, text: "@he", color: "#0055FF", textColor: "#FFFFFF" },
        { t: 0.85, text: "@her", color: "#0055FF", textColor: "#FFFFFF" },
        { t: 0.97, text: "@herm", color: "#0055FF", textColor: "#FFFFFF" },
        { t: 1.09, text: "@herme", color: "#0055FF", textColor: "#FFFFFF" },
        { t: 1.21, text: "@hermes", color: "#0055FF", textColor: "#FFFFFF" },
        { t: 1.79, text: "@hermes", color: "#0055FF", textColor: "#0055FF" },
      ];
      const CHANGE_TIMES = SEQUENCE.filter((e, i) => i > 0 && e.text !== SEQUENCE[i - 1].text).map((e) => e.t);
      const TYPING_GRACE = 0.2;

      function entryAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i -= 1) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return SEQUENCE[0];
      }

      const textEl = document.getElementById("f03-thread-text");
      const cursorEl = document.getElementById("f03-thread-cursor");
      let lastText = "__uninitialized__";
      let lastColor = "";
      let lastTextColor = "";

      const driver = { t: 0 };
      tl.to(driver, {
        t: TYPE_DUR,
        duration: TYPE_DUR,
        ease: "none",
        onUpdate: () => {
          const entry = entryAt(driver.t);
          if (entry.text !== lastText) {
            textEl.textContent = entry.text;
            lastText = entry.text;
          }
          if (entry.color !== lastColor) {
            cursorEl.style.background = entry.color;
            lastColor = entry.color;
          }
          if (entry.textColor !== lastTextColor) {
            textEl.style.color = entry.textColor;
            lastTextColor = entry.textColor;
          }
        },
      }, S3);

      // deterministic square-wave blink, solid while typing (baked change times)
      const blink = { p: 0 };
      tl.to(blink, {
        p: Math.PI * 2 * 3, // 3 whole cycles across TYPE_DUR
        duration: TYPE_DUR,
        ease: "none",
        onUpdate: () => {
          const isTyping = CHANGE_TIMES.some((t) => t <= driver.t && driver.t - t < TYPING_GRACE);
          cursorEl.style.opacity = isTyping ? "1" : Math.sin(blink.p) > 0 ? "1" : "0";
        },
      }, S3);

      // Scene 4 (6.280–8.299): one conversation line extends from @hermes across all panels;
      // three message ticks reveal sequentially; triptych holds for the last phrase
      tl.fromTo("#f03-convo-line", {
        scaleX: 0,
        transformOrigin: "right center",
      }, {
        scaleX: 1,
        duration: 0.85,
        ease: "power2.inOut",
      }, S4 + 0.05);

      tl.fromTo("#f03-convo-label", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, S4 + 0.35);

      ["#f03-tick-1", "#f03-tick-2", "#f03-tick-3"].forEach((sel, i) => {
        tl.fromTo(sel, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, S4 + 0.72 + i * 0.2);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["03-three-live-flows"] = tl;
    })();
  </script>
