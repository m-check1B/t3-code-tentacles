  <script>
    (() => {
      const DURATION = 9.259;
      const tl = gsap.timeline({ paused: true });

      const plate = document.getElementById("f04-plate");
      const headline = document.getElementById("f04-headline");
      const chromeRow = document.getElementById("f04-chrome-row");
      const num1 = document.getElementById("f04-num-1");
      const suf1 = document.getElementById("f04-suf-1");
      const label1 = document.getElementById("f04-label-1");
      const num2 = document.getElementById("f04-num-2");
      const label2 = document.getElementById("f04-label-2");
      const num3 = document.getElementById("f04-num-3");
      const label3 = document.getElementById("f04-label-3");
      const forkTrack = document.getElementById("f04-fork-track");
      const num4 = document.getElementById("f04-num-4");
      const suf4 = document.getElementById("f04-suf-4");
      const label4 = document.getElementById("f04-label-4");
      const rail = document.getElementById("f04-rail");
      const stampText = document.getElementById("f04-stamp-text");
      const receipt = document.getElementById("f04-receipt");
      const macos = document.getElementById("f04-macos");

      // svg-path-draw setup — measured lengths, never hard-coded
      ["f04-tick-1", "f04-tick-2", "f04-stamp-check"].forEach((id) => {
        const p = document.getElementById(id);
        const len = p.getTotalLength();
        p.style.strokeDasharray = `${len}`;
        p.style.strokeDashoffset = `${len}`;
      });

      // — Scene 1 (0.0–1.5s): plate cuts in, column 1 counts 39/39 —
      tl.fromTo(chromeRow, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out" }, 0.05);
      tl.fromTo(headline, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.08);
      tl.fromTo(plate, { opacity: 0, y: -26 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.08);

      // counting-dynamic-scale: value proxy + scale share timing/ease
      const COUNT_EASE = "power3.out";
      const START_SCALE = 0.5;
      const count1 = { value: 0 };
      tl.fromTo(num1, { scale: START_SCALE }, { scale: 1, duration: 1.0, ease: COUNT_EASE }, 0.5);
      tl.to(count1, {
        value: 39,
        duration: 1.0,
        ease: COUNT_EASE,
        onUpdate: () => {
          num1.textContent = Math.round(count1.value).toLocaleString();
        },
      }, 0.5);
      tl.fromTo(label1, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.65);
      tl.fromTo(suf1, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.7)" }, 1.5);

      // — Scene 2 (1.5–3.0s): column 2 counts 3, three flow bars fill —
      const count2 = { value: 0 };
      tl.fromTo(num2, { scale: START_SCALE }, { scale: 1, duration: 1.0, ease: COUNT_EASE }, 1.6);
      tl.to(count2, {
        value: 3,
        duration: 1.0,
        ease: COUNT_EASE,
        onUpdate: () => {
          num2.textContent = Math.round(count2.value).toLocaleString();
        },
      }, 1.6);
      tl.fromTo(label2, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.72);
      // stat-bars-and-fills: same start/ease/duration as the count so they land as one beat
      tl.fromTo(["#f04-fill-1", "#f04-fill-2", "#f04-fill-3"],
        { scaleX: 0 },
        { scaleX: 1, duration: 1.0, ease: COUNT_EASE, stagger: 0.1 }, 1.6);

      // — Scene 3 (3.0–4.4s): column 3 — 0 settles fast, fork track stays empty —
      tl.fromTo(num3, { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.45, ease: COUNT_EASE }, 3.05);
      tl.fromTo(label3, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.15);
      tl.fromTo(forkTrack, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 3.35);
      // deliberate stillness: the empty track never fills — absence is the proof

      // — Scene 4 (4.4–6.2s): column 4 — 2×, two review ticks draw —
      const count4 = { value: 0 };
      tl.fromTo(num4, { scale: START_SCALE }, { scale: 1, duration: 0.7, ease: COUNT_EASE }, 4.45);
      tl.to(count4, {
        value: 2,
        duration: 0.7,
        ease: COUNT_EASE,
        onUpdate: () => {
          num4.textContent = Math.round(count4.value).toLocaleString();
        },
      }, 4.45);
      tl.fromTo(label4, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.55);
      tl.fromTo(suf4, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.7)" }, 5.15);
      // svg-path-draw: ticks draw sequentially, second starts at ~75% of the first
      tl.to("#f04-tick-1", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 5.25);
      tl.to("#f04-tick-2", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 5.55);

      // — Scene 5 (6.2–8.2s): green rail travels, stamp, receipt, honesty line —
      tl.fromTo(rail, { scaleX: 0 }, { scaleX: 1, duration: 0.95, ease: "power2.inOut" }, 6.2);
      tl.to("#f04-stamp-check", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 7.2);
      tl.fromTo(stampText, { opacity: 0, x: -22 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 7.35);
      tl.fromTo(receipt, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 7.55);
      tl.fromTo(macos, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" }, 7.9);

      // full grid holds still to the cut — extend timeline to the fixed frame duration
      tl.set(rail, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-proof-before-promotion"] = tl;
    })();
  </script>
