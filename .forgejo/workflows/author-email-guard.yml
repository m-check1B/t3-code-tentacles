name: Author email guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  author-email-guard:
    runs-on: jack-ci-x64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require the approved author and committer identity in new commits
        env:
          GUARD_EVENT: ${{ github.event_name }}
          GUARD_BEFORE: ${{ github.event.before }}
          GUARD_AFTER: ${{ github.sha }}
          GUARD_BASE: ${{ github.event.pull_request.base.sha }}
          GUARD_HEAD: ${{ github.event.pull_request.head.sha }}
          GUARD_DEFAULT: ${{ github.event.repository.default_branch }}
          GUARD_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess, sys

          def git(*args, raw=False):
              value = subprocess.check_output(['git', *args], text=True, stderr=subprocess.DEVNULL)
              return value if raw else value.strip()

          def commit(value):
              if not re.fullmatch(r'[0-9a-fA-F]{40}|[0-9a-fA-F]{64}', value):
                  raise ValueError('missing or invalid commit identity')
              return git('rev-parse', '--verify', value + '^{commit}')

          try:
              event = os.environ['GUARD_EVENT']
              if event == 'pull_request':
                  head = commit(os.environ['GUARD_HEAD'])
                  base = commit(os.environ['GUARD_BASE'])
                  revisions = [head, '^' + base]
              elif event == 'push':
                  after = os.environ['GUARD_AFTER']
                  if after and set(after) == {'0'}:
                      sys.exit(0)  # Deletion adds no commits.
                  head = commit(after)
                  before = os.environ.get('GUARD_BEFORE', '')
                  revisions = [head]
                  if before and set(before) != {'0'}:
                      revisions.append('^' + commit(before))
                  else:
                      # A new branch/tag may point exactly at published history.
                      # Initial default-branch creation still checks all commits.
                      default_name = os.environ['GUARD_DEFAULT']
                      default = 'refs/remotes/origin/' + default_name
                      known = subprocess.run(['git', 'rev-parse', '--verify', default + '^{commit}'],
                                             text=True, capture_output=True)
                      if known.returncode == 0 and os.environ['GUARD_REF'] != 'refs/heads/' + default_name:
                          revisions.append('^' + known.stdout.strip())
              else:
                  raise ValueError('unsupported event')
              approved_email = '127414494+m-check1B@users.noreply.github.com'
              commits = git('rev-list', *revisions, '--').splitlines()
              rejected = False
              for sha in commits:
                  emails = git('show', '-s', '--format=%ae%n%ce', sha, raw=True).splitlines()
                  for field, email in zip(('author', 'committer'), emails):
                      if email != approved_email:
                          print(f'::error::Unapproved {field} email in commit {sha}; use the approved noreply identity.')
                          rejected = True
              if rejected:
                  sys.exit(1)
              print(f'Author email guard passed: {len(commits)} new commit(s).')
          except (KeyError, ValueError, subprocess.CalledProcessError):
              print('::error::Cannot establish the complete commit range; refusing an unchecked change.')
              sys.exit(1)
          PY
